<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnflow Seeds - Balance Details & Passbook</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f1f7f2; display: flex; justify-content: center; min-height: 100vh; padding: 15px; }
        .app-container { width: 100%; max-width: 430px; background: #ffffff; min-height: 100vh; padding: 20px; padding-bottom: 90px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }

        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid #e2e8f0; }
        .header h2 { font-size: 18px; font-weight: 800; color: #0f172a; }
        .back-btn { text-decoration: none; color: #0f172a; font-size: 18px; }

        .summary-card { background: linear-gradient(135deg, #16a34a, #15803d); color: white; border-radius: 18px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(22,163,74,0.2); }
        .summary-card .top-label { font-size: 12px; font-weight: 600; opacity: 0.9; text-transform: uppercase; }
        .summary-card .main-bal { font-size: 30px; font-weight: 800; margin: 6px 0 16px; }
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 12px; }
        .summary-item h5 { font-size: 11px; opacity: 0.85; font-weight: 600; }
        .summary-item p { font-size: 16px; font-weight: 800; margin-top: 2px; }

        .filter-tabs { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 4px; }
        .tab-btn { flex: 1; min-width: 70px; background: #f1f5f9; border: none; padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; color: #64748b; cursor: pointer; text-align: center; }
        .tab-btn.active { background: #16a34a; color: #ffffff; }

        .tx-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .tx-left { display: flex; align-items: center; gap: 12px; }
        .tx-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .tx-icon.credit { background: #dcfce7; color: #16a34a; }
        .tx-icon.debit { background: #fee2e2; color: #dc2626; }
        .tx-title { font-size: 13px; font-weight: 700; color: #0f172a; }
        .tx-time { font-size: 11px; color: #94a3b8; margin-top: 2px; }

        .tx-right { text-align: right; }
        .tx-amount { font-size: 15px; font-weight: 800; }
        .tx-amount.credit { color: #16a34a; }
        .tx-amount.debit { color: #dc2626; }
        .tx-status { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #64748b; }

        .empty-box { text-align: center; padding: 40px 20px; color: #94a3b8; }
        .empty-box i { font-size: 40px; color: #cbd5e1; margin-bottom: 10px; }
        .empty-box p { font-size: 13px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <a href="profile.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2>Account Passbook</h2>
            <div></div>
        </div>

        <div class="summary-card">
            <div class="top-label">Available Balance</div>
            <div class="main-bal" id="dispAvailableBal">₹0.00</div>
            <div class="summary-grid">
                <div class="summary-item">
                    <h5>Total Recharge</h5>
                    <p id="dispTotalRec">₹0.00</p>
                </div>
                <div class="summary-item">
                    <h5>Total Income</h5>
                    <p id="dispTotalInc">₹0.00</p>
                </div>
            </div>
        </div>

        <div class="filter-tabs">
            <button class="tab-btn active" onclick="filterTransactions('all', this)">All</button>
            <button class="tab-btn" onclick="filterTransactions('income', this)">Income</button>
            <button class="tab-btn" onclick="filterTransactions('recharge', this)">Recharge</button>
            <button class="tab-btn" onclick="filterTransactions('withdraw', this)">Withdraw</button>
        </div>

        <div id="transactionsContainer">
            <div class="empty-box"><i class="fa-solid fa-spinner fa-spin"></i><p>Loading transactions...</p></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ardnjjbcfhnaubzsdznu.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyZG5qamJjZmhuYXVienNkem51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MTUwNjAsImV4cCI6MjEwMjA5MTA2MH0.CDxCJPR4iaoBQPBzmExlEdJ26DTILLbuxxgTumibpUA";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let allTransactions = [];
        let activeFilter = 'all';

        document.addEventListener("DOMContentLoaded", async function() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return window.location.replace('login.html');

            await loadUserDataAndPassbook(session.user.id);
        });

        async function loadUserDataAndPassbook(userId) {
            try {
                // 1. Fetch user summary balances
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('balance, total_recharge, total_income')
                    .eq('id', userId)
                    .single();

                if (profile) {
                    document.getElementById('dispAvailableBal').innerText = '₹' + parseFloat(profile.balance || 0).toFixed(2);
                    document.getElementById('dispTotalRec').innerText = '₹' + parseFloat(profile.total_recharge || 0).toFixed(2);
                    document.getElementById('dispTotalInc').innerText = '₹' + parseFloat(profile.total_income || 0).toFixed(2);
                }

                // 2. Fetch all transaction records
                const { data: txs, error } = await supabaseClient
                    .from('transactions')
                    .select('*')
                    .eq('user_id', userId)
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allTransactions = txs || [];
                renderTransactions();

            } catch (err) {
                console.error("Passbook load error:", err);
                document.getElementById('transactionsContainer').innerHTML = '<div class="empty-box"><p style="color:#ef4444;">Error loading passbook records</p></div>';
            }
        }

        function filterTransactions(type, btn) {
            activeFilter = type;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderTransactions();
        }

        function renderTransactions() {
            const container = document.getElementById('transactionsContainer');
            let list = allTransactions;

            if (activeFilter === 'income') {
                list = allTransactions.filter(t => t.type === 'deposit' || (t.payment_details && (t.payment_details.includes('Daily') || t.payment_details.includes('Bonus') || t.payment_details.includes('Reward') || t.payment_details.includes('Commission'))));
            } else if (activeFilter === 'recharge') {
                list = allTransactions.filter(t => t.payment_details && t.payment_details.includes('Recharge'));
            } else if (activeFilter === 'withdraw') {
                list = allTransactions.filter(t => t.type === 'withdraw' || (t.payment_details && t.payment_details.includes('Withdraw')));
            }

            if (!list || list.length === 0) {
                container.innerHTML = '<div class="empty-box"><i class="fa-solid fa-receipt"></i><p>No transaction history found</p></div>';
                return;
            }

            container.innerHTML = list.map(tx => {
                const isDebit = tx.type === 'withdraw' || (tx.payment_details && tx.payment_details.toLowerCase().includes('plan buy'));
                const amountSign = isDebit ? '-' : '+';
                const colorClass = isDebit ? 'debit' : 'credit';
                const iconName = isDebit ? 'fa-arrow-up-right-from-square' : 'fa-arrow-down-left-and-up-right-to-center';
                const dateStr = new Date(tx.created_at).toLocaleString('en-IN', {
                    day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
                });

                return `
                    <div class="tx-card">
                        <div class="tx-left">
                            <div class="tx-icon ${colorClass}">
                                <i class="fa-solid ${isDebit ? 'fa-arrow-up' : 'fa-arrow-down'}"></i>
                            </div>
                            <div>
                                <div class="tx-title">${tx.payment_details || (isDebit ? 'Payout / Purchase' : 'Credit / Bonus')}</div>
                                <div class="tx-time">${dateStr}</div>
                            </div>
                        </div>
                        <div class="tx-right">
                            <div class="tx-amount ${colorClass}">${amountSign}₹${parseFloat(tx.amount).toFixed(2)}</div>
                            <div class="tx-status">${tx.status || 'Success'}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
