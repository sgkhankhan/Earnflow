<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnflow Seeds - My Team</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f1f7f2; display: flex; justify-content: center; min-height: 100vh; padding: 15px; }
        .app-container { width: 100%; max-width: 430px; background: #ffffff; min-height: 100vh; padding: 20px; padding-bottom: 90px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .header h2 { font-size: 18px; font-weight: 800; color: #0f172a; }
        .back-btn { text-decoration: none; color: #0f172a; font-size: 18px; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 12px 8px; text-align: center; }
        .stat-card h4 { font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 4px; }
        .stat-card p { font-size: 16px; font-weight: 800; color: #16a34a; }

        .tab-menu { display: flex; background: #f1f5f9; border-radius: 12px; padding: 4px; margin-bottom: 15px; }
        .tab-btn { flex: 1; border: none; background: transparent; padding: 8px; font-size: 12px; font-weight: 700; color: #64748b; border-radius: 8px; cursor: pointer; }
        .tab-btn.active { background: #16a34a; color: #ffffff; }

        .member-card { background: #ffffff; border: 1px solid #e2ebd8; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .member-info h5 { font-size: 14px; font-weight: 700; color: #0f172a; }
        .member-info p { font-size: 11px; color: #64748b; margin-top: 2px; }
        .badge { font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 6px; background: #dcfce7; color: #15803d; }
        
        .no-data { text-align: center; color: #94a3b8; font-size: 13px; font-weight: 600; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2>My Team Details</h2>
            <div></div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h4>Level 1</h4>
                <p id="l1Count">0</p>
            </div>
            <div class="stat-card">
                <h4>Level 2</h4>
                <p id="l2Count">0</p>
            </div>
            <div class="stat-card">
                <h4>Level 3</h4>
                <p id="l3Count">0</p>
            </div>
        </div>

        <div class="tab-menu">
            <button class="tab-btn active" id="btnL1" onclick="switchLevel(1)">Level 1 (27%)</button>
            <button class="tab-btn" id="btnL2" onclick="switchLevel(2)">Level 2 (2%)</button>
            <button class="tab-btn" id="btnL3" onclick="switchLevel(3)">Level 3 (1%)</button>
        </div>

        <div id="membersList">
            <div class="no-data"><i class="fa-solid fa-spinner fa-spin"></i> Loading team members...</div>
        </div>
    </div>
        
    <script>
        const SUPABASE_URL = "https://ardnjjbcfhnaubzsdznu.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyZG5qamJjZmhuYXVienNkem51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MTUwNjAsImV4cCI6MjEwMjA5MTA2MH0.CDxCJPR4iaoBQPBzmExlEdJ26DTILLbuxxgTumibpUA";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let teamL1 = [], teamL2 = [], teamL3 = [];
        let activeTab = 1;

        document.addEventListener("DOMContentLoaded", async function() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) return window.location.replace('login.html');

                const userPhone = session.user.email ? session.user.email.split('@')[0] : '';

                // Fetch current user profile
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', session.user.id)
                    .maybeSingle();

                const myRef = (profile && profile.referral_code) ? profile.referral_code : userPhone;
                await loadTeamData(myRef, userPhone);
            } catch (err) {
                console.error("Team load error:", err);
                const listEl = document.getElementById('membersList');
                if (listEl) listEl.innerHTML = '<div class="no-data"><i class="fa-solid fa-triangle-exclamation"></i> Error loading team data</div>';
            }
        });

        async function loadTeamData(myRef, userPhone) {
            try {
                // Fetch Level 1 Members (match either referral_code or raw phone)
                const { data: l1, error: l1Err } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .or(`referred_by.eq.${myRef},referred_by.eq.${userPhone}`);

                teamL1 = l1 || [];
                if (document.getElementById('l1Count')) document.getElementById('l1Count').innerText = teamL1.length;

                // Fetch Level 2 Members
                if (teamL1.length > 0) {
                    const l1Identifiers = [];
                    teamL1.forEach(m => {
                        if (m.referral_code) l1Identifiers.push(m.referral_code);
                        if (m.email) l1Identifiers.push(m.email.split('@')[0]);
                        if (m.phone) l1Identifiers.push(m.phone);
                    });

                    const cleanL1 = [...new Set(l1Identifiers)].filter(Boolean);

                    if (cleanL1.length > 0) {
                        const { data: l2 } = await supabaseClient
                            .from('profiles')
                            .select('*')
                            .in('referred_by', cleanL1);

                        teamL2 = l2 || [];
                    }
                }
                if (document.getElementById('l2Count')) document.getElementById('l2Count').innerText = teamL2.length;

                // Fetch Level 3 Members
                if (teamL2.length > 0) {
                    const l2Identifiers = [];
                    teamL2.forEach(m => {
                        if (m.referral_code) l2Identifiers.push(m.referral_code);
                        if (m.email) l2Identifiers.push(m.email.split('@')[0]);
                        if (m.phone) l2Identifiers.push(m.phone);
                    });

                    const cleanL2 = [...new Set(l2Identifiers)].filter(Boolean);

                    if (cleanL2.length > 0) {
                        const { data: l3 } = await supabaseClient
                            .from('profiles')
                            .select('*')
                            .in('referred_by', cleanL2);

                        teamL3 = l3 || [];
                    }
                }
                if (document.getElementById('l3Count')) document.getElementById('l3Count').innerText = teamL3.length;

                renderList();
            } catch (e) {
                console.error("Fetch level error:", e);
                renderList();
            }
        }

        function switchLevel(lvl) {
            activeTab = lvl;
            if (document.getElementById('btnL1')) document.getElementById('btnL1').classList.toggle('active', lvl === 1);
            if (document.getElementById('btnL2')) document.getElementById('btnL2').classList.toggle('active', lvl === 2);
            if (document.getElementById('btnL3')) document.getElementById('btnL3').classList.toggle('active', lvl === 3);
            renderList();
        }

        function renderList() {
            const container = document.getElementById('membersList');
            if (!container) return;

            let list = activeTab === 1 ? teamL1 : (activeTab === 2 ? teamL2 : teamL3);

            if (!list || list.length === 0) {
                container.innerHTML = '<div class="no-data"><i class="fa-solid fa-users-slash"></i> No members found in Level ' + activeTab + '</div>';
                return;
            }

            container.innerHTML = list.map(member => {
                const phone = member.email ? member.email.split('@')[0] : (member.referral_code || member.phone || 'User');
                const recharge = parseFloat(member.total_recharge || 0);
                const regDate = member.created_at ? new Date(member.created_at).toLocaleDateString() : 'Active';

                return `
                    <div class="member-card" style="display:flex; justify-content:space-between; align-items:center; background:#ffffff; border:1px solid #e2e8f0; padding:12px; border-radius:12px; margin-bottom:8px;">
                        <div class="member-info">
                            <h5 style="font-size:13px; font-weight:800; color:#0f172a;">+91 ${phone}</h5>
                            <p style="font-size:11px; color:#64748b; margin-top:2px;">Recharge: <b style="color:#16a34a;">₹${recharge.toFixed(2)}</b> | Joined: ${regDate}</p>
                        </div>
                        <span class="badge" style="background:#dcfce7; color:#15803d; font-size:10px; font-weight:800; padding:4px 8px; border-radius:6px;">Level ${activeTab}</span>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
