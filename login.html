<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnflow Seeds - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-slate-100 p-4">

    <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl p-6 border border-slate-100">
        <div class="flex justify-center mb-4">
            <div class="w-16 h-16 bg-emerald-100 rounded-2xl flex items-center justify-center text-3xl">🌱</div>
        </div>

        <h2 class="text-2xl font-bold text-center text-slate-800">Earnflow Seeds</h2>
        <p class="text-xs text-center text-slate-400 mt-1 mb-6">Sign in to your account</p>

        <form id="loginForm" onsubmit="handleDirectLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Mobile Number</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 font-semibold text-sm">+91</span>
                    <input type="tel" id="loginPhone" maxlength="10" placeholder="10-digit number" value="7417945133" required
                        class="w-full pl-12 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" />
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password" value="123456" required
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" />
            </div>

            <button type="submit" id="btnLogin"
                class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm shadow-md transition">
                Sign In
            </button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = "https://ardnjjbcfhnaubzsdznu.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyZG5qamJjZmhuYXVienNkem51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MTUwNjAsImV4cCI6MjEwMjA5MTA2MH0.CDxCJPR4iaoBQPBzmExlEdJ26DTILLbuxxgTumibpUA";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleDirectLogin(e) {
            e.preventDefault();
            
            const rawPhone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const btn = document.getElementById('btnLogin');
            const cleanPhone = rawPhone.replace(/[^0-9]/g, '').slice(-10);

            btn.disabled = true;
            btn.innerText = "Checking...";

            try {
                // Fetch profiles table without restrictions
                const { data, error } = await supabaseClient
                    .from('profiles')
                    .select('*');

                if (error) {
                    throw new Error("Supabase Error: " + error.message + " (Hint: " + (error.hint || 'Check RLS') + ")");
                }

                if (!data || data.length === 0) {
                    throw new Error("Profiles table poori khali hai. Koi bhi user nahi mila.");
                }

                // Match user by clean 10-digit number
                const matchedUser = data.find(u => {
                    const p = String(u.phone || '').replace(/[^0-9]/g, '').slice(-10);
                    return p === cleanPhone;
                });

                if (!matchedUser) {
                    throw new Error(`Number ${cleanPhone} database me nahi hai. Table me total ${data.length} users hain.`);
                }

                if (matchedUser.is_blocked) {
                    throw new Error("Account block hai.");
                }

                // Save session
                localStorage.setItem('earnflow_user', JSON.stringify(matchedUser));
                localStorage.setItem('user_phone', cleanPhone);
                localStorage.setItem('user_id', matchedUser.id);

                alert("✅ Login Successful! Welcome " + cleanPhone);
                window.location.href = "./index.html";

            } catch (err) {
                alert("❌ " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Sign In";
            }
        }
    </script>
</body>
    </html>
