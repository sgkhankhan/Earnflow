<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnflow Seeds - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f1f7f2; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .app-container { width: 100%; max-width: 420px; background: #ffffff; padding: 30px 20px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); text-align: center; }
        .logo-box { width: 64px; height: 64px; background: #dcfce7; color: #16a34a; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 15px; }
        h2 { font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
        p.sub { font-size: 13px; color: #64748b; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 6px; }
        .input-box { width: 100%; padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 12px; font-size: 14px; font-weight: 600; outline: none; background: #f8fafc; transition: 0.2s; }
        .input-box:focus { border-color: #16a34a; background: #ffffff; }
        .btn-submit { width: 100%; background: #16a34a; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25); }
        .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }
        .footer-text { font-size: 13px; color: #64748b; margin-top: 20px; }
        .footer-text a { color: #16a34a; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="logo-box"><i class="fa-solid fa-seedling"></i></div>
        <h2>Earnflow Seeds</h2>
        <p class="sub">Welcome back! Sign in to your account</p>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" id="mobile" class="input-box" placeholder="Enter mobile number" maxlength="10" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="input-box" placeholder="Enter password" required>
            </div>
            <button type="submit" id="loginBtn" class="btn-submit">Sign In</button>
        </form>
<!-- Forgot Password Link -->
<div style="text-align: right; margin: -6px 0 14px;">
    <a href="javascript:void(0)" onclick="openForgotModal()" style="font-size: 13px; color: #16a34a; text-decoration: none; font-weight: 600;">Forgot Password?</a>
</div>

<!-- Forgot Password Popup Modal -->
<div id="forgotModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9999; justify-content: center; align-items: center; padding: 16px;">
    <div style="background: #ffffff; border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
        <h3 style="font-size: 18px; font-weight: 800; color: #0f172a; margin: 0 0 8px;">Reset Password 🔑</h3>
        <p style="font-size: 13px; color: #64748b; margin: 0 0 16px;">Apna registered 10-digit number aur naya password enter karein.</p>

        <label style="font-size: 12px; font-weight: 700; color: #475569;">Mobile Number</label>
        <input type="tel" id="forgotPhone" placeholder="Enter 10-digit number" maxlength="10" style="width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; margin: 6px 0 12px; font-size: 14px; box-sizing: border-box;" />

        <label style="font-size: 12px; font-weight: 700; color: #475569;">New Password</label>
        <input type="password" id="forgotNewPassword" placeholder="Enter new password" style="width: 100%; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; margin: 6px 0 18px; font-size: 14px; box-sizing: border-box;" />

        <div style="display: flex; gap: 10px;">
            <button type="button" onclick="closeForgotModal()" style="flex: 1; padding: 11px; border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 8px; font-weight: 700; color: #475569; cursor: pointer;">Cancel</button>
            <button type="button" id="btnSubmitReset" onclick="handlePasswordReset()" style="flex: 1; padding: 11px; border: none; background: #16a34a; color: #ffffff; border-radius: 8px; font-weight: 700; cursor: pointer;">Reset Now</button>
        </div>
    </div>
</div>
        
        <div class="footer-text">
            Don't have an account? <a href="register.html">Register</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ardnjjbcfhnaubzsdznu.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyZG5qamJjZmhuYXVienNkem51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MTUwNjAsImV4cCI6MjEwMjA5MTA2MH0.CDxCJPR4iaoBQPBzmExlEdJ26DTILLbuxxgTumibpUA";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const phone = document.getElementById('mobile').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!phone || !password) {
                return alert("Mobile number aur password enter karein");
            }

            btn.disabled = true;
            btn.innerText = "Signing in...";

            try {
                // Register ke exact format se match karein
                const authEmail = `${phone}@earnflow.seed`;

                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: authEmail,
                    password: password
                });

                if (error) {
                    // Agar puraane user ne @earnflow.app se banaya ho toh fallback check
                    const fallbackEmail = `${phone}@earnflow.app`;
                    const { data: fbData, error: fbErr } = await supabaseClient.auth.signInWithPassword({
                        email: fallbackEmail,
                        password: password
                    });

                    if (fbErr) throw error; // Agar dono fail ho tabhi error throw karein
                }

                window.location.replace('index.html');
            } catch (err) {
                console.error("Login Error:", err);
                alert("Login failed: " + (err.message || "Invalid mobile number or password"));
                btn.disabled = false;
                btn.innerText = "Sign In";
            }
        }
        function openForgotModal() {
    document.getElementById('forgotModal').style.display = 'flex';
}

function closeForgotModal() {
    document.getElementById('forgotModal').style.display = 'none';
    document.getElementById('forgotPhone').value = '';
    document.getElementById('forgotNewPassword').value = '';
}

async function handlePasswordReset() {
    const phone = document.getElementById('forgotPhone').value.trim();
    const newPassword = document.getElementById('forgotNewPassword').value.trim();
    const btn = document.getElementById('btnSubmitReset');

    if (!phone || phone.length !== 10) {
        alert("Please enter a valid 10-digit mobile number.");
        return;
    }
    if (!newPassword || newPassword.length < 6) {
        alert("New password must be at least 6 characters long.");
        return;
    }

    btn.disabled = true;
    btn.innerText = "Updating...";

    try {
        const { data, error } = await supabaseClient.rpc('reset_password_by_phone', {
            target_phone: phone,
            new_password: newPassword
        });

        if (error) throw error;

        if (data === true) {
            alert("✅ Password reset successful! Aap naye password se login kar sakte hain.");
            closeForgotModal();
        } else {
            alert("❌ Mobile number not found. Kripya check karein ya naya account banayein.");
        }
    } catch (err) {
        console.error("Reset error:", err);
        alert("❌ Failed to reset password: " + err.message);
    } finally {
        btn.disabled = false;
        btn.innerText = "Reset Now";
    }
                                                  }
                
    </script>
</body>
</html>
