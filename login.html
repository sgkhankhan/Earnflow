<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnflow - Login / Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f4f7f4; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 430px; background: #ffffff; min-height: 100vh; padding: 25px 20px; position: relative; display: flex; flex-direction: column; justify-content: center; }
        
        .logo-box { text-align: center; margin-bottom: 25px; }
        .logo-icon { width: 70px; height: 70px; background: linear-gradient(135deg, #1b5e20, #2e7d32); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; margin: 0 auto 10px; box-shadow: 0 4px 10px rgba(46, 125, 50, 0.3); }
        .logo-box h2 { font-size: 24px; color: #1b5e20; font-weight: bold; }
        .logo-box p { font-size: 12px; color: #666; margin-top: 2px; }

        .tab-box { display: flex; background: #f0fdf4; border: 1px solid #c8e6c9; border-radius: 25px; padding: 4px; margin-bottom: 25px; z-index: 10; }
        .tab-btn { flex: 1; border: none; background: transparent; padding: 12px; border-radius: 20px; font-weight: bold; color: #2e7d32; cursor: pointer; transition: 0.3s; font-size: 14px; }
        .tab-btn.active { background: #2e7d32; color: white; }

        .form-container { display: flex; flex-direction: column; gap: 15px; }
        .input-group { position: relative; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #2e7d32; font-size: 16px; }
        .input-box { width: 100%; padding: 12px 15px 12px 45px; border: 1px solid #ccc; border-radius: 12px; font-size: 14px; outline: none; transition: 0.3s; }
        .input-box:focus { border-color: #2e7d32; box-shadow: 0 0 5px rgba(46, 125, 50, 0.2); }

        .submit-btn { width: 100%; background: linear-gradient(135deg, #2e7d32, #1b5e20); color: white; border: none; padding: 14px; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; position: relative; z-index: 10; }
        .submit-btn:active { transform: scale(0.98); }

        .form-footer { text-align: center; font-size: 12px; color: #666; margin-top: 15px; }
        .form-footer a { color: #1b5e20; text-decoration: none; font-weight: bold; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="logo-box">
            <div class="logo-icon"><i class="fa-solid fa-wheat-awn"></i></div>
            <h2>Earnflow</h2>
            <p>Growing Quality, Harvesting Prosperity</p>
        </div>

        <div class="tab-box">
            <button type="button" class="tab-btn active" id="loginTabBtn">Log In</button>
            <button type="button" class="tab-btn" id="signupTabBtn">Register</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="form-container">
            <div class="input-group">
                <i class="fa-solid fa-mobile-screen"></i>
                <input type="tel" id="loginPhone" class="input-box" placeholder="Phone Number" maxlength="10" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="loginPassword" class="input-box" placeholder="Password" required>
            </div>
            <button type="submit" id="loginBtn" class="submit-btn">Log In</button>
            <div class="form-footer"><a href="#">Forgot Password?</a></div>
        </form>

        <!-- Signup Form -->
        <form id="signupForm" class="form-container hidden">
            <div class="input-group">
                <i class="fa-solid fa-mobile-screen"></i>
                <input type="tel" id="signupPhone" class="input-box" placeholder="Phone Number" maxlength="10" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="confirmPassword" class="input-box" placeholder="Set Password" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-user-plus"></i>
                <input type="text" id="referralCode" class="input-box" placeholder="Referral Code (Optional)">
            </div>
            <button type="submit" id="signupBtn" class="submit-btn">Create Account</button>
            <div class="form-footer">By registering, you agree to our Terms & Conditions.</div>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://ardnjjbcfhnaubzsdznu.supabase.co';
        
        // Raw Key (Isme hum Code ke andar hi pehla letter small force kar rahe hain)
        let RAW_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyZG5qamJjZmhuYXVienNkem51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MTUwNjAsImV4cCI6MjEwMjA5MTA2MH0.CDxCJPR4iaoBQPBzmExlEdJ26DTILLbuxxgTumibpUA';
        
        // Auto-Fix Capital Letter Issue
        const SUPABASE_ANON_KEY = 'e' + RAW_KEY.substring(1);

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const loginTabBtn = document.getElementById('loginTabBtn');
        const signupTabBtn = document.getElementById('signupTabBtn');

        loginTabBtn.addEventListener('click', function() {
            loginForm.classList.remove('hidden');
            signupForm.classList.add('hidden');
            loginTabBtn.classList.add('active');
            signupTabBtn.classList.remove('active');
        });

        signupTabBtn.addEventListener('click', function() {
            signupForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
            signupTabBtn.classList.add('active');
            loginTabBtn.classList.remove('active');
        });

        signupForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const phone = document.getElementById('signupPhone').value.trim();
            const password = document.getElementById('confirmPassword').value;

            if (phone.length < 10) {
                alert('Please enter a valid 10-digit phone number');
                return;
            }

            const signupBtn = document.getElementById('signupBtn');
            signupBtn.innerText = "Creating Account...";
            signupBtn.disabled = true;

            const email = phone + "@earnflow.app";

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });

                if (error) {
                    alert("Signup Error: " + error.message);
                } else {
                    alert("Account created successfully!");
                    window.location.href = 'index.html';
                }
            } catch (err) {
                alert("Connection Error: " + err.message);
            } finally {
                signupBtn.innerText = "Create Account";
                signupBtn.disabled = false;
            }
        });

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value;
            const email = phone + "@earnflow.app";

            const loginBtn = document.getElementById('loginBtn');
            loginBtn.innerText = "Logging in...";
            loginBtn.disabled = true;

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    alert("Login Failed: " + error.message);
                } else {
                    alert("Login Successful!");
                    window.location.href = 'index.html';
                }
            } catch (err) {
                alert("Connection Error: " + err.message);
            } finally {
                loginBtn.innerText = "Log In";
                loginBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
