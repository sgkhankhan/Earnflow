<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnflow - API Key Debugger</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f1f7f2; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 15px; max-width: 380px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn { background: #16a34a; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        .log-box { background: #1e293b; color: #38bdf8; padding: 12px; border-radius: 8px; font-size: 12px; text-align: left; margin-top: 15px; word-break: break-all; font-family: monospace; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Supabase Connection Test</h2>
        <p style="font-size:12px; color:#64748b; margin-top:5px;">API Key Verification Mode</p>
        
        <button class="btn" onclick="testConnection()">Test Connection Now</button>

        <div id="log" class="log-box">Click button to test connection...</div>
    </div>

    <script>
        const SUPABASE_URL = "https://ardnjjbcfhnaubzsdznu.supabase.co";
        // Fixed Small 'e' Correct Key
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyZG5qamJjZmhuYXVienNkem51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MTUwNjAsImV4cCI6MjE0MjA5MTA2MH0.CDxCJPR4iaoBQPBzmExlEdJ26DTILLbuxxgTumibpUA";

        const log = document.getElementById('log');

        async function testConnection() {
            log.innerText = "Testing connection to Supabase...\nURL: " + SUPABASE_URL;

            try {
                const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                
                const { data, error } = await supabaseClient.from('profiles').select('id').limit(1);

                if (error) {
                    log.innerHTML = `<span style="color:#ef4444;">❌ ERROR: ${error.message}</span>`;
                } else {
                    log.innerHTML = `<span style="color:#4ade80;">✅ SUCCESS! Connected to Supabase Database successfully!</span>\nProfiles found: ${data.length}`;
                }
            } catch (err) {
                log.innerHTML = `<span style="color:#ef4444;">❌ CRITICAL ERROR: ${err.message}</span>`;
            }
        }
    </script>
</body>
</html>
