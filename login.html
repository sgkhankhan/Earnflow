<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnflow Seeds - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f1f7f2; }
        .box { background: white; padding: 25px; border-radius: 15px; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; }
        button { width: 100%; padding: 10px; background: #16a34a; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h3 style="text-align:center; color:#16a34a; margin-bottom:15px;">Earnflow Login</h3>
        <input type="tel" id="phone" placeholder="Mobile Number (10 digit)">
        <input type="password" id="pass" placeholder="Password">
        <button onclick="loginUser()">Sign In / Register</button>
        <div id="msg" style="margin-top:10px; font-size:12px; text-align:center;"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://ardnjjbcfhnaubzsdznu.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyZG5qamJjZmhuYXVienNkem51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MTUwNjAsImV4cCI6MjEwMjA5MTA2MH0.CDxCJPR4iaoBQPBzmExlEdJ26DTILLbuxxgTumibpUA";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loginUser() {
            const phone = document.getElementById('phone').value.trim();
            const pass = document.getElementById('pass').value;
            const msg = document.getElementById('msg');

            if(!phone || !pass) return alert("Fill all details");

            msg.style.color = "blue";
            msg.innerText = "Connecting...";

            const email = `${phone}@earnflow.app`;

            // Try Direct Sign In
            let { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });

            if (error) {
                // If account not found, auto-register
                const signup = await supabaseClient.auth.signUp({ email, password: pass });
                if(signup.error) {
                    msg.style.color = "red";
                    msg.innerText = "Error: " + signup.error.message;
                } else {
                    await supabaseClient.from('profiles').upsert([{ id: signup.data.user.id, email, balance: 0, referral_code: phone }]);
                    alert("Registration Successful!");
                    window.location.replace('index.html');
                }
            } else {
                alert("Login Successful!");
                window.location.replace('index.html');
            }
        }
    </script>
</body>
</html>
