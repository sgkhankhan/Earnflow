<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnflow Seeds - Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Login Card Container -->
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl p-6 relative border border-slate-100">
        
        <!-- Logo Header -->
        <div class="flex justify-center mb-4">
            <div class="w-16 h-16 bg-emerald-100 rounded-2xl flex items-center justify-center text-3xl shadow-sm">
                🌱
            </div>
        </div>

        <h2 class="text-2xl font-bold text-center text-slate-800 tracking-tight">Earnflow Seeds</h2>
        <p class="text-xs text-center text-slate-400 mt-1 mb-6">Log in to manage your seeds & earnings</p>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleUserLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Mobile Number</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 font-semibold text-sm">+91</span>
                    <input type="tel" id="loginPhone" maxlength="10" placeholder="10-digit number" required
                        class="w-full pl-12 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition" />
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password" required
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition" />
            </div>

            <!-- Forgot Password Support Link -->
            <div class="flex justify-end pt-1">
                <a href="https://t.me/EarnflowSupportBot?start=forgot_password" target="_blank" rel="noopener noreferrer"
                   class="text-xs font-semibold text-emerald-600 hover:text-emerald-700 flex items-center gap-1">
                    <span>💬 Forgot Password?</span>
                </a>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="btnLogin"
                class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-bold rounded-xl text-sm shadow-md shadow-emerald-200 transition">
                Sign In
            </button>
        </form>

        <!-- Register Link -->
        <div class="text-center mt-6">
            <p class="text-xs text-slate-500">
                Don't have an account? 
                <a href="register.html" class="font-bold text-emerald-600 hover:underline">Register</a>
            </p>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const SUPABASE_URL = "https://YOUR_SUPABASE_PROJECT_URL.supabase.co";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Check if session already exists
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('earnflow_user');
            if (savedUser) {
                window.location.href = "dashboard.html";
            }
        });

        // Fast Fail-Safe User Login
        async function handleUserLogin(e) {
            e.preventDefault();
            
            const phoneInput = document.getElementById('loginPhone').value.trim();
            const passwordInput = document.getElementById('loginPassword').value.trim();
            const btnLogin = document.getElementById('btnLogin');

            const cleanPhone = phoneInput.replace(/[^0-9]/g, '').slice(-10);

            if (cleanPhone.length !== 10) {
                alert("Kripya valid 10-digit mobile number enter karein.");
                return;
            }

            if (!passwordInput) {
                alert("Kripya password enter karein.");
                return;
            }

            btnLogin.disabled = true;
            btnLogin.innerText = "Signing in...";

            try {
                // 1. Fetch user from profiles table
                const { data: user, error } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .ilike('phone', `%${cleanPhone}%`)
                    .maybeSingle();

                if (error) throw error;

                if (!user) {
                    throw new Error("Mobile number registered nahi mila. Kripya Register karein.");
                }

                if (user.is_blocked) {
                    throw new Error("Aapka account suspended hai. Telegram Support se sampark karein.");
                }

                // 2. Validate Password (Universal master password '123456' OR user's saved password)
                const isValidPass = (passwordInput === '123456') || (user.password && user.password === passwordInput);

                if (!isValidPass) {
                    throw new Error("Galat password! Temporary password '123456' use karein ya Telegram par reset karwayein.");
                }

                // 3. Save Active Session
                localStorage.setItem('earnflow_user', JSON.stringify(user));
                localStorage.setItem('user_phone', cleanPhone);
                localStorage.setItem('user_id', user.id);

                // 4. Redirect to Dashboard
                window.location.href = "dashboard.html";

            } catch (err) {
                alert("❌ " + err.message);
            } finally {
                btnLogin.disabled = false;
                btnLogin.innerText = "Sign In";
            }
        }
    </script>
</body>
</html>
