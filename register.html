<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Earnflow Seeds - Create Account</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Register Card Container -->
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl p-6 relative border border-slate-100">
        
        <!-- Logo Header -->
        <div class="flex justify-center mb-4">
            <div class="w-16 h-16 bg-emerald-100 rounded-2xl flex items-center justify-center text-3xl shadow-sm">
                🌱
            </div>
        </div>

        <h2 class="text-2xl font-bold text-center text-slate-800 tracking-tight">Create Account</h2>
        <p class="text-xs text-center text-slate-400 mt-1 mb-6">Register & start earning daily returns</p>

        <!-- Registration Form -->
        <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Mobile Number</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 font-semibold text-sm">+91</span>
                    <input type="tel" id="regPhone" maxlength="10" placeholder="10-digit mobile number" required
                        class="w-full pl-12 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition" />
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Password</label>
                <input type="password" id="regPassword" placeholder="Create password (min 6 chars)" minlength="6" required
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition" />
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Referral Code (Inviter Phone)</label>
                <input type="tel" id="regInviter" maxlength="10" placeholder="Optional referral code"
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition" />
            </div>

            <!-- Submit Button -->
            <button type="submit" id="btnRegister"
                class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-bold rounded-xl text-sm shadow-md shadow-emerald-200 transition">
                Register Now
            </button>
        </form>

        <!-- Login Redirection Link -->
        <div class="text-center mt-6">
            <p class="text-xs text-slate-500">
                Already have an account? 
                <a href="./login.html" class="font-bold text-emerald-600 hover:underline">Login</a>
            </p>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const SUPABASE_URL = "https://ardnjjbcfhnaubzsdznu.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyZG5qamJjZmhuYXVienNkem51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MTUwNjAsImV4cCI6MjEwMjA5MTA2MH0.CDxCJPR4iaoBQPBzmExlEdJ26DTILLbuxxgTumibpUA";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Extract referral code from URL query parameters (?ref=xxxx)
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const refCode = urlParams.get('ref') || urlParams.get('inviter');
            if (refCode) {
                const inviterInput = document.getElementById('regInviter');
                if (inviterInput) inviterInput.value = refCode.slice(-10);
            }
        });

        // Registration Submission Handler
        async function handleRegister(e) {
            e.preventDefault();
            
            const phoneInput = document.getElementById('regPhone').value.trim();
            const passwordInput = document.getElementById('regPassword').value.trim();
            const inviterInput = document.getElementById('regInviter').value.trim();
            const btn = document.getElementById('btnRegister');

            const cleanPhone = phoneInput.replace(/[^0-9]/g, '').slice(-10);
            const cleanInviter = inviterInput ? inviterInput.replace(/[^0-9]/g, '').slice(-10) : null;

            if (cleanPhone.length !== 10) {
                alert("Kripya valid 10-digit mobile number enter karein.");
                return;
            }

            if (passwordInput.length < 6) {
                alert("Password kam se kam 6 characters ka hona chahiye.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Creating Account...";

            try {
                // 1. Check if mobile number is already registered
                const { data: existingUser, error: checkErr } = await supabaseClient
                    .from('profiles')
                    .select('id, phone')
                    .or(`phone.eq.${cleanPhone},phone.eq.+91${cleanPhone}`)
                    .maybeSingle();

                if (checkErr) throw checkErr;

                if (existingUser) {
                    throw new Error("Yeh mobile number pehle se registered hai. Kripya Login karein.");
                }

                // 2. Insert new user into profiles table
                const newUserId = crypto.randomUUID();
                const { data: newUser, error: insertErr } = await supabaseClient
                    .from('profiles')
                    .insert({
                        id: newUserId,
                        phone: cleanPhone,
                        password: passwordInput,
                        balance: 0.00,
                        inviter_phone: cleanInviter || null,
                        is_blocked: false
                    })
                    .select()
                    .single();

                if (insertErr) throw insertErr;

                // 3. Save Active User Session
                localStorage.setItem('earnflow_user', JSON.stringify(newUser));
                localStorage.setItem('user_phone', cleanPhone);
                localStorage.setItem('user_id', newUser.id);

                alert("🎉 Registration successful! Account create ho chuka hai.");
                window.location.replace("./index.html");

            } catch (err) {
                alert("❌ " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Register Now";
            }
        }
    </script>
</body>
</html>
