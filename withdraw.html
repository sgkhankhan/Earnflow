<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnflow Seeds - Withdrawal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f1f7f2; display: flex; justify-content: center; min-height: 100vh; padding: 15px; }
        .app-container { width: 100%; max-width: 430px; background: #ffffff; min-height: 100vh; padding: 20px; padding-bottom: 90px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }

        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #e2e8f0; }
        .header h2 { font-size: 18px; font-weight: 800; color: #0f172a; }
        .back-btn { text-decoration: none; color: #0f172a; font-size: 18px; }

        .balance-banner { background: linear-gradient(135deg, #16a34a, #15803d); color: white; padding: 20px; border-radius: 16px; margin-bottom: 20px; text-align: center; }
        .balance-banner p { font-size: 12px; opacity: 0.9; text-transform: uppercase; font-weight: 600; }
        .balance-banner h3 { font-size: 28px; font-weight: 800; margin-top: 4px; }

        .form-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px; margin-bottom: 20px; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 6px; }
        .input-box { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; font-weight: 600; outline: none; background: #ffffff; }
        .input-box:focus { border-color: #16a34a; }

        .btn-withdraw { width: 100%; background: #16a34a; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn-withdraw:active { transform: scale(0.98); }

        .notice-card { background: #fefce8; border: 1px solid #fef08a; padding: 12px; border-radius: 12px; margin-top: 15px; }
        .notice-card h5 { color: #854d0e; font-size: 12px; font-weight: 800; margin-bottom: 4px; }
        .notice-card p { color: #a16207; font-size: 11px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <a href="profile.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2>Withdraw Funds</h2>
            <div></div>
        </div>

        <div class="balance-banner">
            <p>Available Balance</p>
            <h3 id="currentBalanceDisplay">₹0.00</h3>
        </div>

        <form id="withdrawForm" onsubmit="handleWithdrawal(event)">
            <div class="form-card">
                <div class="input-group">
                    <label>Withdraw Amount (₹)</label>
                    <input type="number" id="withdrawAmount" class="input-box" placeholder="Min. ₹200" min="200" required>
                </div>

                <div class="input-group">
                    <label>Account Holder Name</label>
                    <input type="text" id="holderName" class="input-box" placeholder="Name as per bank" required>
                </div>

                <div class="input-group">
                    <label>Bank Account Number</label>
                    <input type="text" id="accountNumber" class="input-box" placeholder="Enter Bank A/C Number" required>
                </div>

                <div class="input-group">
                    <label>IFSC Code</label>
                    <input type="text" id="ifscCode" class="input-box" placeholder="e.g. SBIN0001234" required>
                </div>

                <div class="input-group">
                    <label>UPI ID (Optional)</label>
                    <input type="text" id="upiId" class="input-box" placeholder="e.g. mobile@upi">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-withdraw">Request Payout</button>
        </form>

        <div class="notice-card">
            <h5><i class="fa-solid fa-circle-info"></i> Withdrawal Rules:</h5>
            <p>• Minimum withdrawal amount: ₹200.<br>• Payout requests are approved within 1 to 24 hours.<br>• Please verify bank details carefully before submitting.</p>
        </div>
    </div>
<script>
    const SUPABASE_URL = "https://ardnjjbcfhnaubzsdznu.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyZG5qamJjZmhuYXVienNkem51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MTUwNjAsImV4cCI6MjEwMjA5MTA2MH0.CDxCJPR4iaoBQPBzmExlEdJ26DTILLbuxxgTumibpUA";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null;
    let availableBalance = 0;

    document.addEventListener("DOMContentLoaded", async function() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) return window.location.replace('login.html');

        currentUser = session.user;
        await loadUserDataAndBank();
    });

    async function loadUserDataAndBank() {
        try {
            // 1. Fetch available balance
            const { data: profile } = await supabaseClient
                .from('profiles')
                .select('balance')
                .eq('id', currentUser.id)
                .single();

            if (profile) {
                availableBalance = parseFloat(profile.balance || 0);
                document.getElementById('currentBalanceDisplay').innerText = '₹' + availableBalance.toFixed(2);
            }

            // 2. Fetch saved bank details & auto-fill form
            const { data: card } = await supabaseClient
                .from('bank_cards')
                .select('*')
                .eq('user_id', currentUser.id)
                .maybeSingle();

            if (card) {
                if (card.holder_name) document.getElementById('holderName').value = card.holder_name;
                if (card.account_number) document.getElementById('accountNumber').value = card.account_number;
                if (card.ifsc_code) document.getElementById('ifscCode').value = card.ifsc_code;
                if (card.upi_id) document.getElementById('upiId').value = card.upi_id;
            }
        } catch (err) {
            console.error("Data load error:", err);
        }
    }

    async function handleWithdrawal(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const amount = parseFloat(document.getElementById('withdrawAmount').value);
        const holderName = document.getElementById('holderName').value.trim();
        const accountNumber = document.getElementById('accountNumber').value.trim();
        const ifscCode = document.getElementById('ifscCode').value.trim().toUpperCase();
        const upiId = document.getElementById('upiId').value.trim();

        if (amount < 200) return alert("Minimum withdrawal amount is ₹200");
        if (amount > availableBalance) return alert(`Insufficient balance! Available: ₹${availableBalance.toFixed(2)}`);

        if (!confirm(`Are you sure you want to withdraw ₹${amount.toFixed(2)}?`)) return;

        btn.disabled = true;
        btn.innerText = "Processing...";

        try {
            const userPhone = currentUser.email ? currentUser.email.split('@')[0] : 'User';

            // Deduct balance
            const newBal = availableBalance - amount;
            const { error: balErr } = await supabaseClient
                .from('profiles')
                .update({ balance: newBal })
                .eq('id', currentUser.id);

            if (balErr) throw balErr;

            // Submit withdrawal request
            const { error: wErr } = await supabaseClient
                .from('withdrawals')
                .insert([{
                    user_id: currentUser.id,
                    user_phone: userPhone,
                    amount: amount,
                    holder_name: holderName,
                    account_number: accountNumber,
                    ifsc_code: ifscCode,
                    upi_id: upiId,
                    status: 'pending'
                }]);

            if (wErr) throw wErr;

            alert(`Withdrawal request of ₹${amount.toFixed(2)} submitted successfully!`);
            window.location.replace('profile.html');

        } catch (err) {
            alert("Withdrawal failed: " + err.message);
            btn.disabled = false;
            btn.innerText = "Request Payout";
        }
    }
                        </script>
    

</body>
</html>
