<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnflow - Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f4f7f4; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 430px; background: #ffffff; min-height: 100vh; padding: 15px; padding-bottom: 90px; position: relative; }
        
        /* Header Profile Box */
        .profile-header { background: linear-gradient(135deg, #1b5e20, #2e7d32); color: white; padding: 20px; border-radius: 20px; text-align: center; position: relative; }
        .avatar-box { width: 70px; height: 70px; background: #ffffff; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 10px; border: 3px solid #81c784; }
        .avatar-box i { font-size: 38px; color: #1b5e20; }
        .user-phone { font-size: 18px; font-weight: bold; }
        .user-id { font-size: 12px; opacity: 0.8; margin-top: 3px; }

        /* Balance Cards */
        .balance-container { display: flex; gap: 10px; margin-top: 15px; }
        .balance-card { flex: 1; background: #f0fdf4; padding: 15px; border-radius: 12px; border: 1px solid #c8e6c9; text-align: center; }
        .balance-card p { font-size: 11px; color: #555; }
        .balance-card h3 { font-size: 18px; color: #1b5e20; margin-top: 4px; }

        /* Menu Options List */
        .menu-list { margin-top: 20px; }
        .menu-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 10px; border-bottom: 1px solid #f0f0f0; cursor: pointer; text-decoration: none; color: #333; }
        .menu-left { display: flex; align-items: center; gap: 12px; }
        .menu-left i { font-size: 18px; color: #2e7d32; width: 25px; text-align: center; }
        .menu-left span { font-size: 14px; font-weight: 500; }
        .menu-right { color: #aaa; font-size: 12px; }

        /* Logout Button */
        .logout-btn { width: 100%; background: #fee2e2; color: #dc2626; border: none; padding: 12px; border-radius: 25px; margin-top: 25px; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 430px; background: #ffffff; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #e0e0e0; left: 50%; transform: translateX(-50%); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #888; cursor: pointer; text-decoration: none; }
        .nav-item.active { color: #2e7d32; font-weight: bold; }
        .wheel-btn { position: relative; top: -20px; }
        .wheel-icon { width: 50px; height: 50px; background: #16a34a; color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 22px; border: 4px solid #ffffff; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- User Header -->
        <div class="profile-header">
            <div class="avatar-box">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="user-phone">+91 98******10</div>
            <div class="user-id">ID: EF889201</div>
        </div>

        <!-- Balance Info -->
        <div class="balance-container">
            <div class="balance-card">
                <p>Wallet Balance</p>
                <h3>₹1,250.00</h3>
            </div>
            <div class="balance-card">
                <p>Total Earnings</p>
                <h3>₹4,800.00</h3>
            </div>
        </div>

        <!-- Navigation / Action List -->
        <div class="menu-list">
            <div class="menu-item">
                <div class="menu-left">
                    <i class="fa-solid fa-wallet"></i>
                    <span>Recharge Record</span>
                </div>
                <div class="menu-right"><i class="fa-solid fa-chevron-right"></i></div>
            </div>

            <div class="menu-item">
                <div class="menu-left">
                    <i class="fa-solid fa-file-invoice-dollar"></i>
                    <span>Withdrawal Record</span>
                </div>
                <div class="menu-right"><i class="fa-solid fa-chevron-right"></i></div>
            </div>

            <div class="menu-item">
                <div class="menu-left">
                    <i class="fa-solid fa-building-columns"></i>
                    <span>Bank Account Details</span>
                </div>
                <div class="menu-right"><i class="fa-solid fa-chevron-right"></i></div>
            </div>

            <div class="menu-item">
                <div class="menu-left">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>Invite Friends & Earn</span>
                </div>
                <div class="menu-right"><i class="fa-solid fa-chevron-right"></i></div>
            </div>

            <div class="menu-item">
                <div class="menu-left">
                    <i class="fa-solid fa-lock"></i>
                    <span>Change Password</span>
                </div>
                <div class="menu-right"><i class="fa-solid fa-chevron-right"></i></div>
            </div>

            <div class="menu-item">
                <div class="menu-left">
                    <i class="fa-solid fa-headset"></i>
                    <span>Customer Support</span>
                </div>
                <div class="menu-right"><i class="fa-solid fa-chevron-right"></i></div>
            </div>
        </div>

        <!-- Logout Button -->
        <button class="logout-btn" onclick="alert('Logging out...')">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Log Out</span>
        </button>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav">
            <a href="index.html" class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
            <div class="nav-item">
                <i class="fa-solid fa-box-archive"></i>
                <span>Treasure</span>
            </div>
            <div class="nav-item wheel-btn">
                <div class="wheel-icon">
                    <i class="fa-solid fa-dharmachakra"></i>
                </div>
                <span>Wheel</span>
            </div>
            <div class="nav-item">
                <i class="fa-solid fa-users"></i>
                <span>Team</span>
            </div>
            <div class="nav-item active">
                <i class="fa-solid fa-user"></i>
                <span>Profile</span>
            </div>
        </div>
    </div>

</body>
</html>
