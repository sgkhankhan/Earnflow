<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnflow - Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f4f7f4; display: none; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 430px; background: #ffffff; min-height: 100vh; padding: 20px; padding-bottom: 90px; position: relative; }
        
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .header h2 { font-size: 20px; color: #1b5e20; }

        .profile-card { background: linear-gradient(135deg, #1b5e20, #2e7d32); color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: center; }
        .avatar-icon { font-size: 50px; margin-bottom: 8px; color: #ffffff; }
        .profile-card h3 { font-size: 18px; font-weight: bold; }
        .profile-card p { font-size: 12px; opacity: 0.8; margin-top: 2px; }

        .menu-list { display: flex; flex-direction: column; gap: 12px; }
        .menu-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: #f9fafb; border: 1px solid #e0e0e0; border-radius: 12px; text-decoration: none; color: #333; font-size: 14px; font-weight: 500; }
        .menu-left { display: flex; align-items: center; gap: 12px; }
        .menu-left i { font-size: 18px; color: #2e7d32; width: 22px; text-align: center; }

        /* Secret Admin Button Style */
        .admin-item { background: #fef2f2; border-color: #fca5a5; color: #dc2626; display: none; }
        .admin-item i { color: #dc2626; }

        .logout-btn { width: 100%; background: #dc2626; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 25px; display: flex; align-items: center; justify-content: center; gap: 8px; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 430px; background: #ffffff; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #e0e0e0; left: 50%; transform: translateX(-50%); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #888; cursor: pointer; text-decoration: none; }
        .nav-item.active { color: #2e7d32; font-weight: bold; }
        .wheel-btn { position: relative; top: -20px; }
        .wheel-icon { width: 50px; height: 50px; background: #16a34a; color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 22px; border: 4px solid #ffffff; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h2>My Profile</h2>
            <div></div>
        </div>

        <div class="profile-card">
            <i class="fa-solid fa-circle-user avatar-icon"></i>
            <h3 id="userDisplayPhone">User</h3>
            <p id="userDisplayEmail">user@earnflow.app</p>
        </div>

        <div class="menu-list">
            <!-- Hidden Admin Panel Link (Visible only to 7983678835) -->
            <a href="admin.html" id="adminPanelBtn" class="menu-item admin-item">
                <div class="menu-left">
                    <i class="fa-solid fa-user-shield"></i>
                    <span>Admin Panel</span>
                </div>
                <i class="fa-solid fa-chevron-right" style="color: #dc2626;"></i>
            </a>

            <a href="recharge.html" class="menu-item">
                <div class="menu-left"><i class="fa-solid fa-wallet"></i><span>Recharge Wallet</span></div>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
            <a href="withdraw.html" class="menu-item">
                <div class="menu-left"><i class="fa-solid fa-money-bill-transfer"></i><span>Withdraw Funds</span></div>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
            <a href="team.html" class="menu-item">
                <div class="menu-left"><i class="fa-solid fa-users"></i><span>My Referral Team</span></div>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>

        <button class="logout-btn" onclick="logoutUser()">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout Account</span>
        </button>

        <div class="bottom-nav">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="recharge.html" class="nav-item"><i class="fa-solid fa-box-archive"></i><span>Treasure</span></a>
            <a href="wheel.html" class="nav-item wheel-btn"><div class="wheel-icon"><i class="fa-solid fa-dharmachakra"></i></div><span>Wheel</span></a>
            <a href="team.html" class="nav-item"><i class="fa-solid fa-users"></i><span>Team</span></a>
            <a href="profile.html" class="nav-item active"><i class="fa-solid fa-user"></i><span>Profile</span></a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ardnjjbcfhnaubzsdznu.supabase.co';
        let RAW_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyZG5qamJjZmhuYXVienNkem51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MTUwNjAsImV4cCI6MjE0MjA5MTA2MH0.CDxCJPR4iaoBQPBzmExlEdJ26DTILLbuxxgTumibpUA';
        const SUPABASE_ANON_KEY = 'e' + RAW_KEY.substring(1);

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // 🔒 ADMIN MOBILE EMAIL FORMAT
        const ADMIN_EMAIL = "7983678835@earnflow.app";

        document.addEventListener("DOMContentLoaded", async function() {
            const { data: { session } } = await supabaseClient.auth.getSession();

            if (!session) {
                window.location.replace('login.html');
            } else {
                document.body.style.display = 'flex';
                const userEmail = session.user.email || '';
                
                const rawPhone = userEmail.replace('@earnflow.app', '');
                document.getElementById('userDisplayPhone').innerText = rawPhone;
                document.getElementById('userDisplayEmail').innerText = userEmail;

                // Reveal Admin Button if mobile matches
                if (userEmail === ADMIN_EMAIL || rawPhone === '7983678835') {
                    document.getElementById('adminPanelBtn').style.display = 'flex';
                }
            }
        });

        async function logoutUser() {
            await supabaseClient.auth.signOut();
            window.location.replace('login.html');
        }
    </script>
</body>
</html>
