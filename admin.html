<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnflow Seeds - Admin Control Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f1f5f9; display: flex; justify-content: center; min-height: 100vh; padding: 15px; }
        .admin-container { width: 100%; max-width: 480px; background: #ffffff; min-height: 100vh; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid #f1f5f9; }
        .header h2 { font-size: 18px; font-weight: 800; color: #0f172a; }
        .back-btn { text-decoration: none; color: #0f172a; font-size: 18px; }

        .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .metric-card { padding: 12px; border-radius: 14px; color: white; text-align: center; }
        .metric-card.users { background: linear-gradient(135deg, #16a34a, #15803d); }
        .metric-card.recharge { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        .metric-card.withdraw { background: linear-gradient(135deg, #dc2626, #b91c1c); }
        .metric-card h4 { font-size: 11px; opacity: 0.9; text-transform: uppercase; margin-bottom: 4px; }
        .metric-card p { font-size: 16px; font-weight: 800; }

        .section-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px; margin-bottom: 20px; }
        .section-title { font-size: 14px; font-weight: 800; color: #0f172a; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

        .form-group { margin-bottom: 12px; }
        .input-box { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 13px; font-weight: 600; outline: none; }

        .btn-action { width: 100%; background: #16a34a; color: white; border: none; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 800; cursor: pointer; }
        
        .req-item { background: #ffffff; border: 1px solid #cbd5e1; padding: 12px; border-radius: 12px; margin-bottom: 10px; }
        .req-info { font-size: 12px; color: #334155; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .action-btns { display: flex; gap: 10px; margin-top: 8px; }
        .btn-approve { flex: 1; background: #16a34a; color: white; border: none; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 800; cursor: pointer; }
        .btn-reject { flex: 1; background: #ef4444; color: white; border: none; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 800; cursor: pointer; }
        .empty-text { text-align: center; color: #64748b; font-size: 12px; padding: 10px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="header">
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2>Admin Control Dashboard</h2>
            <div></div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card users">
                <h4>Users</h4>
                <p id="totalUsersCount">0</p>
            </div>
            <div class="metric-card recharge">
                <h4>Recharge</h4>
                <p id="totalRechargeSum">₹0</p>
            </div>
            <div class="metric-card withdraw">
                <h4>Withdrawal</h4>
                <p id="totalWithdrawSum">₹0</p>
            </div>
        </div>

        <!-- User Search & Balance Control -->
        <div class="section-card">
            <div class="section-title"><i class="fa-solid fa-user-gear"></i> User Search, Balance & Suspend</div>
            <div class="form-group" style="display:flex; gap:8px;">
                <input type="tel" id="searchPhone" class="input-box" placeholder="Enter Mobile Number">
                <button class="btn-action" style="width: auto; padding: 0 16px;" onclick="searchUser()">Search</button>
            </div>
            <div id="searchResult" style="display:none; margin-top:12px; padding-top:12px; border-top:1px dashed #cbd5e1;">
                <p style="font-size:12px; font-weight:700; margin-bottom:6px;">User: <span id="resUserPhone" style="color:#16a34a;">-</span></p>
                <p style="font-size:12px; font-weight:700; margin-bottom:10px;">Balance: ₹<span id="resUserBalance">0</span></p>
                
                <div class="form-group">
                    <input type="number" id="manualAmount" class="input-box" placeholder="Enter Amount">
                </div>
                <div style="display:flex; gap:8px; margin-bottom:10px;">
                    <button class="btn-action" onclick="updateUserBalance('add')">+ Add Balance</button>
                    <button class="btn-action" style="background:#ef4444;" onclick="updateUserBalance('subtract')">- Deduct</button>
                </div>
            </div>
        </div>

        <!-- Pending Recharges List -->
        <div class="section-card">
            <div class="section-title"><i class="fa-solid fa-clock-rotate-left"></i> Pending Recharges</div>
            <div id="rechargeList">
                <div class="empty-text">Loading requests...</div>
            </div>
        </div>

        <!-- Pending Withdrawals List -->
        <div class="section-card">
            <div class="section-title"><i class="fa-solid fa-money-bill-transfer"></i> Pending Withdrawals</div>
            <div id="withdrawalList">
                <div class="empty-text">Loading requests...</div>
            </div>
        </div>
    </div>
        <script>
        const SUPABASE_URL = "https://ardnjjbcfhnaubzsdznu.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyZG5qamJjZmhuYXVienNkem51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MTUwNjAsImV4cCI6MjEwMjA5MTA2MH0.CDxCJPR4iaoBQPBzmExlEdJ26DTILLbuxxgTumibpUA";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let searchedUser = null;

        document.addEventListener("DOMContentLoaded", function() {
            fetchDashboardMetrics();
            loadPendingRecharges();
            loadPendingWithdrawals();
        });

        async function fetchDashboardMetrics() {
            try {
                const { count: usersCount } = await supabaseClient.from('profiles').select('*', { count: 'exact', head: true });
                if (usersCount !== null && usersCount !== undefined) {
                    document.getElementById('totalUsersCount').innerText = usersCount;
                }

                const { data: recs } = await supabaseClient.from('recharges').select('amount').eq('status', 'approved');
                if (recs) {
                    const totalRec = recs.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
                    document.getElementById('totalRechargeSum').innerText = '₹' + totalRec.toFixed(2);
                }
            } catch (e) {
                console.error("Metrics error:", e);
            }
        }

        async function searchUser() {
            const input = document.getElementById('searchPhone').value.trim();
            if (!input) return alert("Please enter mobile number");

            const email = `${input}@earnflow.app`;

            const { data, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .or(`email.eq.${email},referral_code.eq.${input}`)
                .maybeSingle();

            let targetUser = data;

            if (!targetUser) {
                const { data: fallbackData } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .ilike('email', `%${input}%`)
                    .maybeSingle();

                targetUser = fallbackData;
            }

            if (!targetUser) {
                alert("User not found!");
                document.getElementById('searchResult').style.display = 'none';
                searchedUser = null;
                return;
            }

            searchedUser = targetUser;
            const displayPhone = searchedUser.email ? searchedUser.email.split('@')[0] : (searchedUser.referral_code || 'User');
            document.getElementById('resUserPhone').innerText = '+91 ' + displayPhone;
            document.getElementById('resUserBalance').innerText = parseFloat(searchedUser.balance || 0).toFixed(2);
            document.getElementById('searchResult').style.display = 'block';
        }

        async function updateUserBalance(action) {
            if (!searchedUser) return alert("Search a user first!");
            const amt = parseFloat(document.getElementById('manualAmount').value);
            if (!amt || amt <= 0) return alert("Enter valid amount");

            let currentBal = parseFloat(searchedUser.balance || 0);
            let newBal = action === 'add' ? currentBal + amt : currentBal - amt;
            if (newBal < 0) return alert("Balance cannot be negative!");

            const { error } = await supabaseClient.from('profiles').update({ balance: newBal }).eq('id', searchedUser.id);
            if (error) return alert("Error: " + error.message);

            alert("Balance updated! New Balance: ₹" + newBal.toFixed(2));
            searchedUser.balance = newBal;
            document.getElementById('resUserBalance').innerText = newBal.toFixed(2);
            document.getElementById('manualAmount').value = '';
        }

        async function loadPendingRecharges() {
            const container = document.getElementById('rechargeList');
            if (!container) return;

            try {
                const { data: txs, error } = await supabaseClient
                    .from('recharges')
                    .select('*')
                    .eq('status', 'pending');

                if (error) {
                    console.error("Fetch Error:", error);
                    container.innerHTML = `<div class="empty-text" style="color:#ef4444;">Error: ${error.message}</div>`;
                    return;
                }

                if (!txs || txs.length === 0) {
                    container.innerHTML = `<div class="empty-text">No pending recharges.</div>`;
                    return;
                }

                container.innerHTML = txs.map(tx => `
                    <div class="req-item">
                        <div class="req-info"><span>Phone:</span> <strong>+91 ${tx.user_phone || 'User'}</strong></div>
                        <div class="req-info"><span>Amount:</span> <strong>₹${tx.amount}</strong></div>
                        <div class="req-info"><span>UTR Number:</span> <strong>${tx.utr || 'N/A'}</strong></div>
                        <div class="action-btns">
                            <button class="btn-approve" onclick="approveRecharge('${tx.id}', '${tx.user_id}', ${tx.amount})">Approve</button>
                            <button class="btn-reject" onclick="rejectRecharge('${tx.id}')">Reject</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = `<div class="empty-text" style="color:#ef4444;">Error loading data</div>`;
            }
        }

        async function approveRecharge(txId, userId, amount) {
            try {
                const rechargeAmt = parseFloat(amount);

                const { data: userProfile, error: profErr } = await supabaseClient
                    .from('profiles')
                    .select('id, balance, total_recharge, referred_by')
                    .eq('id', userId)
                    .single();

                if (profErr) return alert("User profile error: " + profErr.message);

                const newBal = parseFloat(userProfile.balance || 0) + rechargeAmt;
                const newTotalRec = parseFloat(userProfile.total_recharge || 0) + rechargeAmt;

                // 1. Credit balance to profile
                await supabaseClient.from('profiles').update({ balance: newBal, total_recharge: newTotalRec }).eq('id', userId);
                
                // 2. Mark recharge as approved
                await supabaseClient.from('recharges').update({ status: 'approved' }).eq('id', txId);

                // 3. Level 1 Referral Bonus (27%)
                if (userProfile.referred_by) {
                    const { data: level1Parent } = await supabaseClient
                        .from('profiles')
                        .select('id, balance, team_income, level1_income')
                        .eq('referral_code', userProfile.referred_by)
                        .maybeSingle();

                    if (level1Parent) {
                        const l1Comm = rechargeAmt * 0.27;
                        await supabaseClient.from('profiles').update({
                            balance: parseFloat(level1Parent.balance || 0) + l1Comm,
                            team_income: parseFloat(level1Parent.team_income || 0) + l1Comm,
                            level1_income: parseFloat(level1Parent.level1_income || 0) + l1Comm
                        }).eq('id', level1Parent.id);
                    }
                }

                alert("Recharge Approved & ₹" + rechargeAmt + " added successfully!");
                loadPendingRecharges();
                fetchDashboardMetrics();
            } catch (err) {
                alert("Action failed: " + err.message);
            }
        }

        async function rejectRecharge(rechargeId) {
            await supabaseClient.from('recharges').update({ status: 'rejected' }).eq('id', rechargeId);
            alert("Recharge request rejected!");
            loadPendingRecharges();
        }

        async function loadPendingWithdrawals() {
            const container = document.getElementById('withdrawalList');
            if (container) {
                container.innerHTML = `<div class="empty-text">No pending withdrawals.</div>`;
            }
        }
    </script>
</body>
</html>
