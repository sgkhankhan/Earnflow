<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnflow - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f4f7f4; display: none; justify-content: center; min-height: 100vh; padding: 15px; }
        .app-container { width: 100%; max-width: 480px; background: #ffffff; min-height: 100vh; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; }
        .header h2 { font-size: 20px; color: #1b5e20; }
        .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
        .metric-card { background: linear-gradient(135deg, #15803d, #16a34a); color: white; border-radius: 14px; padding: 12px 10px; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.2); display: flex; flex-direction: column; justify-content: space-between; }
        .metric-card.blue { background: linear-gradient(135deg, #1e40af, #2563eb); }
        .metric-card.red { background: linear-gradient(135deg, #b91c1c, #ef4444); }
        .metric-card h4 { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.85); text-transform: uppercase; }
        .metric-card h2 { font-size: 15px; font-weight: 800; margin-top: 4px; }
        .card { background: #f9fafb; border: 1px solid #e0e0e0; border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        .card h3 { font-size: 15px; color: #1b5e20; margin-bottom: 10px; }
        .input-box { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; margin-bottom: 8px; outline: none; }
        .save-btn { background: #2e7d32; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h2><i class="fa-solid fa-user-shield"></i> Admin Panel</h2>
            <a href="index.html" style="color: #2e7d32; text-decoration: none; font-weight: bold; font-size: 14px;">Home</a>
        </div>
        <div class="metrics-grid">
            <div class="metric-card"><div><h4>Users</h4><h2 id="totalUsersCount">0</h2></div></div>
            <div class="metric-card blue"><div><h4>Rec.</h4><h2 id="totalRechargeVolume">₹0</h2></div></div>
            <div class="metric-card red"><div><h4>With.</h4><h2 id="totalWithdrawVolume">₹0</h2></div></div>
        </div>
        <div class="card">
            <h3><i class="fa-solid fa-qrcode"></i> Update Payment Settings</h3>
            <input type="text" id="upiInput" class="input-box" placeholder="Enter UPI ID (e.g. name@upi)">
            <input type="text" id="qrInput" class="input-box" placeholder="Enter QR Code Image Link (URL)">
            <button class="save-btn" onclick="savePaymentSettings()">Save Settings</button>
        </div>
        <!-- (Baki cards same rahenge...) -->
            <script>
        const SUPABASE_URL = "https://ardnjjbcfhnaubzsdznu.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyZG5qamJjZmhuYXVienNkem51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MTUwNjAsImV4cCI6MjE0MjA5MTA2MH0.CDxCJPR4iaoBQPBzmExlEdJ26DTILLbuxxgTumibpUA";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ... (Baaki code: loadPendingRecharges, fetchDashboardMetrics functions wahi purane wale yahan paste karein) ...

        async function savePaymentSettings() {
            const upi = document.getElementById('upiInput').value.trim();
            const qr = document.getElementById('qrInput').value.trim();
            
            if (!upi) return alert("Enter UPI ID");

            const { error } = await supabaseClient.from('app_settings').upsert({ 
                id: 1, 
                upi_id: upi, 
                qr_code_url: qr 
            });

            if (error) {
                console.error("Save Error:", error);
                alert("Error: " + error.message);
            } else {
                alert("Settings Saved Successfully!");
            }
        }
    </script>
</body>
</html>
