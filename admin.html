<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Debug Mode</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .input-box { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .save-btn { background: green; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div style="max-width: 480px; width: 100%; margin: auto;">
        <div class="card">
            <h3>Update UPI & QR</h3>
            <input type="text" id="upiInput" class="input-box" placeholder="UPI ID">
            <input type="text" id="qrInput" class="input-box" placeholder="QR Image URL">
            <button class="save-btn" onclick="savePaymentSettings()">Save Settings</button>
        </div>
        <div id="statusLog" style="color: red; font-size: 12px; margin-top: 10px;"></div>
    </div>
        <script>
        const SUPABASE_URL = "https://ardnjjbcfhnaubzsdznu.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyZG5qamJjZmhuYXVienNkem51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MTUwNjAsImV4cCI6MjE0MjA5MTA2MH0.CDxCJPR4iaoBQPBzmExlEdJ26DTILLbuxxgTumibpUA";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function savePaymentSettings() {
            const upi = document.getElementById('upiInput').value.trim();
            const qr = document.getElementById('qrInput').value.trim();
            const log = document.getElementById('statusLog');
            
            log.innerText = "Saving...";

            const { error } = await supabaseClient
                .from('app_settings')
                .upsert({ id: 1, upi_id: upi, qr_code_url: qr });

            if (error) {
                log.innerText = "Error: " + error.message;
                alert("Database Error: " + error.message);
            } else {
                log.style.color = "green";
                log.innerText = "Saved Successfully!";
                alert("Settings Saved!");
            }
        }
    </script>
</body>
</html>
