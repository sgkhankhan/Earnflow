<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnflow - Lucky Wheel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f4f7f4; display: none; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 430px; background: #ffffff; min-height: 100vh; padding: 20px; padding-bottom: 90px; position: relative; text-align: center; }
        
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .header h2 { font-size: 20px; color: #1b5e20; }
        .back-btn { text-decoration: none; color: #1b5e20; font-size: 20px; }

        .banner { background: linear-gradient(135deg, #1b5e20, #2e7d32); color: white; padding: 15px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .banner h3 { font-size: 16px; margin-bottom: 4px; }
        .banner p { font-size: 12px; opacity: 0.9; }

        /* Premium Wheel Container */
        .wheel-box { position: relative; width: 290px; height: 290px; margin: 10px auto 30px; border-radius: 50%; padding: 8px; background: linear-gradient(145deg, #ffd700, #b8860b); box-shadow: 0 8px 20px rgba(0,0,0,0.25); }
        .wheel-pointer { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 28px solid #dc2626; z-index: 20; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.4)); }
        
        .wheel { width: 100%; height: 100%; border-radius: 50%; position: relative; overflow: hidden; transition: transform 4s cubic-bezier(0.15, 0.9, 0.15, 1); background: conic-gradient(#16a34a 0deg 60deg, #f59e0b 60deg 120deg, #2563eb 120deg 180deg, #dc2626 180deg 240deg, #8b5cf6 240deg 300deg, #10b981 300deg 360deg); border: 4px solid #ffffff; }

        /* Wheel Center Gold Cap */
        .wheel-center-cap { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; background: radial-gradient(circle, #ffe259, #ffa751); border-radius: 50%; z-index: 15; border: 3px solid #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; color: #78350f; font-size: 18px; }

        /* Clear Readable Labels */
        .slice-label { position: absolute; top: 0; left: 50%; width: 60px; height: 50%; margin-left: -30px; transform-origin: 50% 100%; text-align: center; padding-top: 15px; font-weight: 800; font-size: 16px; color: #ffffff; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        .l1 { transform: rotate(30deg); }
        .l2 { transform: rotate(90deg); }
        .l3 { transform: rotate(150deg); }
        .l4 { transform: rotate(210deg); }
        .l5 { transform: rotate(270deg); }
        .l6 { transform: rotate(330deg); }

        .spin-btn { width: 100%; max-width: 290px; background: linear-gradient(135deg, #2e7d32, #1b5e20); color: white; border: none; padding: 15px; border-radius: 25px; font-size: 17px; font-weight: bold; cursor: pointer; margin-bottom: 12px; box-shadow: 0 4px 12px rgba(46, 125, 50, 0.4); }
        .spin-btn:disabled { background: #9ca3af; cursor: not-allowed; box-shadow: none; }

        .timer-msg { font-size: 13px; color: #dc2626; font-weight: bold; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 430px; background: #ffffff; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #e0e0e0; left: 50%; transform: translateX(-50%); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #888; cursor: pointer; text-decoration: none; }
        .nav-item.active { color: #2e7d32; font-weight: bold; }
        .wheel-btn { position: relative; top: -20px; }
        .wheel-icon { width: 50px; height: 50px; background: #16a34a; color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 22px; border: 4px solid #ffffff; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2>Daily Lucky Wheel</h2>
            <div></div>
        </div>

        <div class="banner">
            <h3>Spin & Win Daily Rewards!</h3>
            <p>Get up to ₹50 bonus added directly to your wallet every 24 hours.</p>
        </div>

        <!-- Lucky Wheel -->
        <div class="wheel-box">
            <div class="wheel-pointer"></div>
            <div class="wheel-center-cap"><i class="fa-solid fa-crown"></i></div>
            <div class="wheel" id="wheelDisk">
                <div class="slice-label l1">₹5</div>
                <div class="slice-label l2">₹10</div>
                <div class="slice-label l3">₹15</div>
                <div class="slice-label l4">₹20</div>
                <div class="slice-label l5">₹25</div>
                <div class="slice-label l6">₹50</div>
            </div>
        </div>

        <button id="spinButton" class="spin-btn" onclick="spinWheel()">Spin Now</button>
        <p id="timerMessage" class="timer-msg"></p>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="recharge.html" class="nav-item"><i class="fa-solid fa-box-archive"></i><span>Treasure</span></a>
            <a href="wheel.html" class="nav-item active wheel-btn"><div class="wheel-icon"><i class="fa-solid fa-dharmachakra"></i></div><span>Wheel</span></a>
            <a href="team.html" class="nav-item"><i class="fa-solid fa-users"></i><span>Team</span></a>
            <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Profile</span></a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ardnjjbcfhnaubzsdznu.supabase.co';
        let RAW_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyZG5qamJjZmhuYXVienNkem51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MTUwNjAsImV4cCI6MjE0MjA5MTA2MH0.CDxCJPR4iaoBQPBzmExlEdJ26DTILLbuxxgTumibpUA';
        const SUPABASE_ANON_KEY = 'e' + RAW_KEY.substring(1);

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null;

        document.addEventListener("DOMContentLoaded", async function() {
            const { data: { session } } = await supabaseClient.auth.getSession();

            if (!session) {
                window.location.replace('login.html');
            } else {
                currentUser = session.user;
                document.body.style.display = 'flex';
                checkSpinEligibility();
            }
        });

        async function checkSpinEligibility() {
            const { data: profile } = await supabaseClient
                .from('profiles')
                .select('last_spin')
                .eq('id', currentUser.id)
                .single();

            if (profile && profile.last_spin) {
                const lastSpinTime = new Date(profile.last_spin);
                const now = new Date();
                const hoursPassed = (now - lastSpinTime) / (1000 * 60 * 60);

                if (hoursPassed < 24) {
                    disableSpin(24 - hoursPassed);
                }
            }
        }

        function disableSpin(remainingHours) {
            const btn = document.getElementById('spinButton');
            const msg = document.getElementById('timerMessage');
            btn.disabled = true;
            btn.innerText = "Already Spun Today";
            msg.innerText = `Next spin available in approx ${Math.ceil(remainingHours)} hours.`;
        }

        async function spinWheel() {
            const btn = document.getElementById('spinButton');
            btn.disabled = true;

            const sliceRewards = [
                { amount: 5, angle: 330 },
                { amount: 10, angle: 270 },
                { amount: 15, angle: 210 },
                { amount: 20, angle: 150 },
                { amount: 25, angle: 90 },
                { amount: 50, angle: 30 }
            ];

            const winningIndex = Math.floor(Math.random() * sliceRewards.length);
            const winningOutcome = sliceRewards[winningIndex];

            const wheelDisk = document.getElementById('wheelDisk');
            const totalRotation = (360 * 5) + winningOutcome.angle;
            wheelDisk.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(async () => {
                try {
                    const { data: profile } = await supabaseClient.from('profiles').select('balance').eq('id', currentUser.id).single();
                    const newBalance = parseFloat(profile.balance || 0) + winningOutcome.amount;

                    await supabaseClient.from('profiles').update({
                        balance: newBalance,
                        last_spin: new Date().toISOString()
                    }).eq('id', currentUser.id);

                    await supabaseClient.from('transactions').insert([{
                        user_id: currentUser.id,
                        type: 'recharge',
                        amount: winningOutcome.amount,
                        status: 'success',
                        payment_details: 'Daily Lucky Wheel Bonus'
                    }]);

                    alert(`Congratulations! You won ₹${winningOutcome.amount} bonus! Added to your wallet.`);
                    disableSpin(24);

                } catch (err) {
                    alert("Error saving reward: " + err.message);
                }
            }, 4000);
        }
    </script>
</body>
</html>
