<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnflow Seeds - Lucky Spin Wheel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #0f172a; display: flex; justify-content: center; min-height: 100vh; padding: 15px; }
        .app-container { width: 100%; max-width: 430px; background: #1e293b; min-height: 100vh; padding: 20px; padding-bottom: 90px; border-radius: 20px; color: white; text-align: center; }

        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #334155; }
        .header h2 { font-size: 18px; font-weight: 800; color: #f8fafc; }
        .back-btn { text-decoration: none; color: #f8fafc; font-size: 18px; }

        .wheel-box { position: relative; width: 300px; height: 300px; margin: 20px auto; display: flex; align-items: center; justify-content: center; }
        #wheelCanvas { width: 100%; height: 100%; border-radius: 50%; border: 6px solid #22c55e; box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); }
        .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 25px solid #ef4444; z-index: 10; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }

        .spin-count-box { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; margin: 15px 0; font-size: 14px; }
        .spin-count-box strong { color: #22c55e; font-size: 16px; }

        .btn-spin { width: 100%; background: linear-gradient(135deg, #22c55e, #16a34a); color: white; border: none; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3); }
        .btn-spin:disabled { background: #64748b; cursor: not-allowed; opacity: 0.6; }
        .btn-spin:active { transform: scale(0.98); }

        .rewards-info { background: rgba(255,255,255,0.03); border: 1px solid #334155; border-radius: 14px; padding: 14px; margin-top: 20px; text-align: left; font-size: 12px; color: #94a3b8; }
        .rewards-info h4 { color: #f8fafc; font-size: 13px; margin-bottom: 6px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2>Lucky Spin Wheel</h2>
            <div></div>
        </div>

        <p style="font-size: 13px; color: #94a3b8;">Spin the wheel daily to win exciting cash prizes!</p>

        <div class="wheel-box">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="300" height="300"></canvas>
        </div>

        <div class="spin-count-box">
            Available Spins: <strong id="spinsLeftDisplay">0</strong>
        </div>

        <button id="spinBtn" class="btn-spin" onclick="startSpin()">SPIN NOW</button>

        <div class="rewards-info">
            <h4><i class="fa-solid fa-gift"></i> Rules:</h4>
            • 1 Free Spin everyday for active users.<br>
            • Winnings are directly added to your Available Balance.<br>
            • More spins unlocked with invites & investments.
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ardnjjbcfhnaubzsdznu.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyZG5qamJjZmhuYXVienNkem51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MTUwNjAsImV4cCI6MjEwMjA5MTA2MH0.CDxCJPR4iaoBQPBzmExlEdJ26DTILLbuxxgTumibpUA";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null;
        let spinsLeft = 0;
        let isSpinning = false;

        const prizes = [
            { text: "₹5", value: 5, color: "#10b981" },
            { text: "₹10", value: 10, color: "#3b82f6" },
            { text: "₹50", value: 50, color: "#8b5cf6" },
            { text: "₹1", value: 1, color: "#f59e0b" },
            { text: "₹20", value: 20, color: "#ec4899" },
            { text: "₹100", value: 100, color: "#14b8a6" }
        ];

        let currentAngle = 0;

        document.addEventListener("DOMContentLoaded", async function() {
            drawWheel();
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return window.location.replace('login.html');

            currentUser = session.user;
            await loadUserSpins();
        });

        function drawWheel() {
            const canvas = document.getElementById("wheelCanvas");
            const ctx = canvas.getContext("2d");
            const numSlices = prizes.length;
            const sliceAngle = (2 * Math.PI) / numSlices;
            const radius = canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            prizes.forEach((prize, i) => {
                const angle = i * sliceAngle;
                ctx.beginPath();
                ctx.fillStyle = prize.color;
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius, angle, angle + sliceAngle);
                ctx.lineTo(radius, radius);
                ctx.fill();
                ctx.stroke();

                // Draw Text
                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(angle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 15px Plus Jakarta Sans, sans-serif";
                ctx.fillText(prize.text, radius - 20, 5);
                ctx.restore();
            });
        }

        async function loadUserSpins() {
            try {
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('spins_left, last_spin_date')
                    .eq('id', currentUser.id)
                    .single();

                const today = new Date().toISOString().split('T')[0];

                if (profile) {
                    if (profile.last_spin_date !== today && (profile.spins_left || 0) <= 0) {
                        // Reset 1 daily free spin
                        await supabaseClient.from('profiles').update({ spins_left: 1, last_spin_date: today }).eq('id', currentUser.id);
                        spinsLeft = 1;
                    } else {
                        spinsLeft = profile.spins_left !== undefined ? profile.spins_left : 1;
                    }
                } else {
                    spinsLeft = 1;
                }

                document.getElementById('spinsLeftDisplay').innerText = spinsLeft;
                document.getElementById('spinBtn').disabled = spinsLeft <= 0;
            } catch (err) {
                console.error("Spins fetch error:", err);
            }
        }

        async function startSpin() {
            if (isSpinning || spinsLeft <= 0) return;

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;

            // Select random winning index
            const winningIndex = Math.floor(Math.random() * prizes.length);
            const wonPrize = prizes[winningIndex];

            const sliceAngle = 360 / prizes.length;
            const stopAngle = 360 - (winningIndex * sliceAngle + sliceAngle / 2) - 90;
            const totalRotation = 360 * 5 + stopAngle; // 5 full rounds + target slice

            const canvas = document.getElementById("wheelCanvas");
            canvas.style.transition = "transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99)";
            canvas.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(async () => {
                try {
                    // Credit reward to user balance
                    const { data: prof } = await supabaseClient.from('profiles').select('balance').eq('id', currentUser.id).single();
                    const newBal = parseFloat(prof.balance || 0) + wonPrize.value;
                    const newSpins = spinsLeft - 1;

                    await supabaseClient.from('profiles').update({
                        balance: newBal,
                        spins_left: newSpins,
                        last_spin_date: new Date().toISOString().split('T')[0]
                    }).eq('id', currentUser.id);

                    // Add transaction log
                    await supabaseClient.from('transactions').insert([{
                        user_id: currentUser.id,
                        type: 'deposit',
                        amount: wonPrize.value,
                        status: 'success',
                        payment_details: `Lucky Spin Reward: ${wonPrize.text}`
                    }]);

                    alert(`🎉 Congratulations! You won ${wonPrize.text}!\nAmount has been credited to your wallet.`);
                    spinsLeft = newSpins;
                    document.getElementById('spinsLeftDisplay').innerText = spinsLeft;

                } catch (e) {
                    alert("Reward credit error: " + e.message);
                } finally {
                    isSpinning = false;
                    canvas.style.transition = "none";
                    canvas.style.transform = `rotate(${stopAngle}deg)`;
                    document.getElementById('spinBtn').disabled = spinsLeft <= 0;
                }
            }, 4200);
        }
    </script>
</body>
</html>
