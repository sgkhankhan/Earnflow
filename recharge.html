<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnflow Seeds - Recharge Wallet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f1f7f2; display: flex; justify-content: center; min-height: 100vh; padding: 15px; }
        .app-container { width: 100%; max-width: 430px; background: #ffffff; min-height: 100vh; padding: 20px; padding-bottom: 90px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .header h2 { font-size: 18px; font-weight: 800; color: #0f172a; }
        .back-btn { text-decoration: none; color: #0f172a; font-size: 18px; }

        .payment-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 18px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .qr-box { width: 180px; height: 180px; margin: 0 auto 15px; background: #ffffff; border: 2px dashed #16a34a; border-radius: 16px; padding: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .qr-box img { width: 100%; height: 100%; object-fit: contain; border-radius: 10px; }

        .upi-box { display: flex; align-items: center; justify-content: space-between; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 10px 14px; margin-top: 10px; }
        .upi-text { font-size: 14px; font-weight: 700; color: #0f172a; word-break: break-all; }
        .copy-btn { background: #dcfce7; color: #15803d; border: none; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; }

        .form-group { margin-bottom: 16px; }
        .form-label { font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 6px; display: block; }
        .input-box { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 14px; font-weight: 600; outline: none; }
        .input-box:focus { border-color: #16a34a; }

        .submit-btn { width: 100%; background: linear-gradient(135deg, #22c55e, #15803d); color: white; border: none; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3); }
        .instructions { font-size: 12px; color: #64748b; margin-top: 15px; line-height: 1.5; background: #f0fdf4; border: 1px solid #bbf7d0; padding: 12px; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2>Recharge Wallet</h2>
            <div></div>
        </div>

        <div class="payment-card">
            <p style="font-size: 12px; font-weight: 700; color: #64748b; margin-bottom: 10px;">SCAN QR CODE TO PAY</p>
            <div class="qr-box">
                <img id="qrCodeImage" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=upi://pay?pa=5326807QJ1@mairtel%26pn=Earnflow" alt="Payment QR Code">
            </div>

            <p style="font-size: 12px; font-weight: 700; color: #64748b;">OR PAY TO UPI ID</p>
            <div class="upi-box">
                <span id="upiDisplay" class="upi-text">5326807QJ1@mairtel</span>
                <button class="copy-btn" onclick="copyUpiId()"><i class="fa-regular fa-copy"></i> Copy</button>
            </div>
        </div>

        <form id="rechargeForm" onsubmit="submitRecharge(event)">
            <div class="form-group">
                <label class="form-label">Amount (₹)</label>
                <input type="number" id="rechargeAmount" class="input-box" placeholder="Enter amount (Min ₹100)" required min="100">
            </div>
            <div class="form-group">
                <label class="form-label">UTR / Transaction ID / Reference No.</label>
                <input type="text" id="utrInput" class="input-box" placeholder="12-digit UTR or Txn Ref No." required>
            </div>
            <button type="submit" class="submit-btn">Submit Recharge Request</button>
        </form>

        <div class="instructions">
            <i class="fa-solid fa-circle-info" style="color: #16a34a;"></i> <b>Instructions:</b><br>
            1. QR code scan karke ya UPI ID par payment karein.<br>
            2. Payment ke baad 12-digit UTR/Txn ID yahan daal kar submit karein.<br>
            3. Admin verification ke baad balance aapke wallet me add ho jayega.
        </div>
    </div>
        <script>
        const SUPABASE_URL = "https://ardnjjbcfhnaubzsdznu.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyZG5qamJjZmhuYXVienNkem51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MTUwNjAsImV4cCI6MjE0MjA5MTA2MH0.CDxCJPR4iaoBQPBzmExlEdJ26DTILLbuxxgTumibpUA";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null;

        document.addEventListener("DOMContentLoaded", async function() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (!session) {
                window.location.replace('login.html');
                return;
            }

            currentUser = session.user;
        });

        function copyUpiId() {
            const upiText = document.getElementById('upiDisplay').innerText;
            navigator.clipboard.writeText(upiText);
            alert("UPI ID copied: " + upiText);
        }

        async function submitRecharge(e) {
            e.preventDefault();

            const amount = parseFloat(document.getElementById('rechargeAmount').value);
            const utr = document.getElementById('utrInput').value.trim();

            if (!amount || amount < 100) return alert("Minimum recharge amount is ₹100");
            if (!utr) return alert("Please enter UTR / Transaction ID");

            try {
                const { error } = await supabaseClient.from('transactions').insert([{
                    user_id: currentUser.id,
                    type: 'recharge',
                    amount: amount,
                    status: 'pending',
                    payment_details: `UTR: ${utr}`
                }]);

                if (error) throw error;

                alert("Recharge request submitted successfully! Pending admin approval.");
                window.location.replace('index.html');

            } catch (err) {
                alert("Error submitting recharge: " + err.message);
            }
        }
    </script>
</body>
</html>
