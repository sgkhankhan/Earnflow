<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnflow Seeds - Recharge</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f1f7f2; display: flex; justify-content: center; min-height: 100vh; padding: 15px; }
        .app-container { width: 100%; max-width: 430px; background: #ffffff; min-height: 100vh; padding: 20px; padding-bottom: 90px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .header h2 { font-size: 18px; font-weight: 800; color: #0f172a; }
        .back-btn { text-decoration: none; color: #0f172a; font-size: 18px; }

        .qr-card { background: #f8fafc; border: 1px dashed #16a34a; border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .qr-img { width: 180px; height: 180px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #cbd5e1; }
        
        .upi-box { display: flex; align-items: center; justify-content: space-between; background: #ffffff; border: 1px solid #cbd5e1; padding: 10px 14px; border-radius: 12px; font-weight: 700; font-size: 13px; margin-top: 8px; }
        .copy-btn { background: #dcfce7; color: #15803d; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 12px; }

        .upi-apps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .upi-app-btn { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px 6px; text-align: center; text-decoration: none; color: #0f172a; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .upi-app-btn i { font-size: 22px; }
        .upi-app-btn.gpay i { color: #4285f4; }
        .upi-app-btn.phonepe i { color: #5f259f; }
        .upi-app-btn.paytm i { color: #00baf2; }

        .form-group { margin-bottom: 15px; }
        .form-label { font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 6px; display: block; }
        .input-box { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 14px; font-weight: 600; outline: none; }

        .submit-btn { width: 100%; background: linear-gradient(135deg, #22c55e, #15803d); color: white; border: none; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2>Account Recharge</h2>
            <div></div>
        </div>

        <div class="qr-card">
            <p style="font-size: 11px; font-weight: 800; color: #64748b; margin-bottom: 10px;">SCAN QR CODE TO PAY</p>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=5326807QJ1@mairtel%26pn=Earnflow" class="qr-img" alt="QR Code">
            
            <div class="upi-box">
                <span id="upiIdText">5326807QJ1@mairtel</span>
                <button class="copy-btn" onclick="copyUpi()"><i class="fa-regular fa-copy"></i> Copy</button>
            </div>
        </div>

        <label class="form-label" style="text-align:center; display:block; margin-bottom:10px;">PAY VIA UPI APPS</label>
        <div class="upi-apps-grid">
            <div class="upi-app-btn gpay" onclick="payViaUpi()">
                <i class="fa-brands fa-google-pay"></i>
                <span>GPay</span>
            </div>
            <div class="upi-app-btn phonepe" onclick="payViaUpi()">
                <i class="fa-solid fa-mobile-screen-button"></i>
                <span>PhonePe</span>
            </div>
            <div class="upi-app-btn paytm" onclick="payViaUpi()">
                <i class="fa-solid fa-wallet"></i>
                <span>Paytm / UPI</span>
            </div>
        </div>

        <form onsubmit="submitRecharge(event)">
            <div class="form-group">
                <label class="form-label">Amount (₹)</label>
                <input type="number" id="rechargeAmount" class="input-box" value="525" min="525" required placeholder="Amount (₹525)">
            </div>

            <div class="form-group">
                <label class="form-label">UTR / Transaction ID / Reference No.</label>
                <input type="text" id="utrNumber" class="input-box" placeholder="12-digit UTR or Txn Ref No." pattern="[0-9]{12}" title="Enter 12-digit UTR number" required>
            </div>

            <button type="submit" class="submit-btn"><i class="fa-solid fa-paper-plane"></i> Submit Recharge Request</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = "https://ardnjjbcfhnaubzsdznu.supabase.co";
        // Verified Original Working Key
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyZG5qamJjZmhuYXVienNkem51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MTUwNjAsImV4cCI6MjEwMjA5MTA2MH0.CDxCJPR4iaoBQPBzmExlEdJ26DTILLbuxxgTumibpUA";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const UPI_ID = "5326807QJ1@mairtel";

        function copyUpi() {
            navigator.clipboard.writeText(UPI_ID);
            alert("UPI ID copied!");
        }

        function payViaUpi() {
            const amount = document.getElementById('rechargeAmount').value;
            if (!amount || amount < 525) {
                alert("Minimum recharge amount is ₹525");
                document.getElementById('rechargeAmount').value = 525;
                document.getElementById('rechargeAmount').focus();
                return;
            }

            navigator.clipboard.writeText(UPI_ID);
            alert("UPI ID (5326807QJ1@mairtel) copy ho gayi hai!\n\nApni GPay / PhonePe / Paytm app khol kar 'Pay to UPI ID' par payment karein aur 12-digit UTR daal kar submit karein.");
        }

        async function submitRecharge(e) {
            e.preventDefault();
            
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return window.location.replace('login.html');

            const amount = parseFloat(document.getElementById('rechargeAmount').value);
            const utr = document.getElementById('utrNumber').value.trim();

            if (!amount || amount < 525) return alert("Minimum recharge amount is ₹525");
            if (utr.length !== 12) return alert("Please enter valid 12-digit UTR number");

            const phone = session.user.email ? session.user.email.split('@')[0] : '';

            const { error } = await supabaseClient.from('recharges').insert([{
                user_id: session.user.id,
                user_phone: phone,
                amount: amount,
                utr: utr,
                status: 'pending'
            }]);

            if (error) {
                alert("Error submitting recharge: " + error.message);
            } else {
                alert("Recharge request submitted successfully! Admin will verify and add balance soon.");
                window.location.replace('index.html');
            }
        }
    </script>
</body>
</html>
